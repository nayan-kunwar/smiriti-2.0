name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: smriti
          POSTGRES_PASSWORD: smriti
          POSTGRES_DB: smriti
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Run migrations
        run: pnpm exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://smriti:smriti@localhost:5432/smriti?schema=public

      - name: Unit tests
        run: pnpm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://smriti:smriti@localhost:5432/smriti?schema=public
          JWT_SECRET: test-secret-min-16-chars
          REDIS_URL: redis://localhost:6379
          QDRANT_URL: http://localhost:6333
          QDRANT_COLLECTION: smriti_test
          EMBEDDING_PROVIDER: ollama
          LLM_PROVIDER: ollama

      - name: Eval harness
        run: pnpm eval

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f docker/Dockerfile.api -t smriti-api:ci .

      - name: Build Worker image
        run: docker build -f docker/Dockerfile.worker -t smriti-worker:ci .
